name: Daily Log Collector

# [비활성화] REST API 방식으로 전환되어 구글시트 수집기 사용 중단 (2026-05-29)
# 재활성화 시: schedule 블록 주석 해제 + collector.py 경로 수정 필요
on:
  workflow_dispatch:         # 수동 실행만 허용 (자동 스케줄 비활성화)

jobs:
  collect:
    runs-on: ubuntu-latest
    if: false  # 비활성화: 수동 실행해도 실제로 동작하지 않음

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas gspread google-auth openpyxl urllib3

      - name: Run collector
        env:
          PHPSESSID: ${{ secrets.PHPSESSID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
        run: |
          python 현황대시보드/collector.py
